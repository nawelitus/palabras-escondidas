      <stop offset="0" stop-color="#8c5a33"/>
      <stop offset="1" stop-color="#4a2a14"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#wood)"/>
  <g stroke="#2e1a0b" stroke-opacity="0.35" stroke-width="6">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>
  <rect x="143" y="155" width="226" height="226" rx="44" fill="#2e1a0b" opacity="0.45"/>
  <rect x="143" y="143" width="226" height="226" rx="44" fill="#f1e3c0" stroke="#c9a66b" stroke-width="8"/>
  <path fill="#3b2412" fill-rule="evenodd" transform="translate(256 256) scale(0.6) translate(-295 -280)" d="M190 130 H290 C350 130 385 160 385 205 C385 235 370 255 345 266 C380 276 400 303 400 340 C400 395 360 430 295 430 H190 Z M235 170 V245 H285 C313 245 330 232 330 208 C330 184 313 170 285 170 Z M235 285 V390 H292 C325 390 345 372 345 337 C345 302 325 285 292 285 Z"/>
