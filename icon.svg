<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Android masks launcher icons to a circle of ~66% of the canvas, so the
       tile and letter stay inside that safe zone and the wood shows around it. -->
